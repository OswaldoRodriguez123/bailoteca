[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bailoteca-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # slowapi 0.1.10 no longer finds handlers once FastAPI nests included
  # routers (0.137+), and its middleware silently skips the limit.
  "fastapi>=0.115,<0.137",
  "uvicorn[standard]>=0.30",
  "slowapi>=0.1.9",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.4",
  "bailoteca-shared",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
# Vercel instala desde pyproject.toml con uv; shared vive fuera de api/.
bailoteca-shared = { path = "../shared" }

[tool.setuptools.packages.find]
where = ["."]
include = ["bailoteca_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "bailoteca_api.main:app"
