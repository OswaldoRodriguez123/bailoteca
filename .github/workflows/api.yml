name: API

on:
  push:
    paths:
      - "api/**"
      - "shared/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - "shared/**"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e shared -e "api[dev]"
      - run: python -m pytest shared/tests api/tests -q
