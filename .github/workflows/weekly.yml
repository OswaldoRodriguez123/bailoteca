name: Actualizar Bailoteca

on:
  schedule:
    # 1р día de cada mes, 03:00 UTC (40 queries/mes -> muy bajo cuota SerpApi free)
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar reportes, sin escribir en la base"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Correr pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BAILOTECA_SOURCES: ${{ secrets.BAILOTECA_SOURCES }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m bailoteca run --dry-run
          else
            python -m bailoteca run
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: reports/