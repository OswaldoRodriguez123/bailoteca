name: OSM spike

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e shared -e "parser[dev]"
      - name: Dry-run con fuente OSM
        working-directory: parser
        env:
          BAILOTECA_SOURCES: osm
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m bailoteca run --dry-run
      - name: Listar reportes
        run: |
          ls -la parser/reports || true
          echo "==== summary ===="
          cat parser/reports/summary.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: osm-reports
          path: parser/reports/
