name: OSM spike

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e shared -e "parser[dev]"
      - run: |
          cat > probe.py <<'PY'
          import json, time
          import httpx
          from bailoteca.sources.osm import build_query, parse_overpass, GRAN_SANTIAGO_BBOX

          mirrors = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
              "https://overpass.osm.ch/api/interpreter",
              "https://overpass.nchc.org.tw/api/interpreter",
              "https://overpass.fi/api/interpreter",
              "https://lz4.overpass-api.de/api/interpreter",
          ]
          bbox = GRAN_SANTIAGO_BBOX
          s, w_, n, e = bbox
          tags = [
              ("amenity", "dancing_school"),
              ("leisure", "dance"),
              ("sport", "dancing"),
              ("shop", "dance"),
              ("leisure", "dance_hall"),
              ("amenity", "dojo"),
              ("leisure", "arts_centre"),
              ("amenity", "arts_centre"),
              ("leisure", "studio"),
              ("leisure", "sports_centre"),
          ]
          full_query = build_query(bbox)

          ep = "https://overpass.osm.ch/api/interpreter"
          for tag, value in tags:
              q = f'[out:json][timeout:25];(node["{tag}"="{value}"]({s},{w_},{n},{e});way["{tag}"="{value}"]({s},{w_},{n},{e}););out count;'
              r = httpx.post(ep, content=q, timeout=45)
              try:
                  elements = r.json().get("elements", [])
                  tags_out = elements[0].get("tags", {}) if elements else {}
                  print(f"[tag] {tag}={value} status={r.status_code} nodes={tags_out.get('nodes')} ways={tags_out.get('ways')}", flush=True)
              except Exception as err:
                  print(f"[tag] {tag}={value} status={r.status_code} parse_error={err}", flush=True)

          try:
              t0 = time.time()
              r2 = httpx.post(ep, content=full_query, timeout=60)
              print(f"[tag] full query status={r2.status_code} in {time.time()-t0:.1f}s", flush=True)
              cands = parse_overpass(r2.json()) if r2.status_code == 200 else []
              print(f"[tag] OSM candidates={len(cands)}", flush=True)
              from bailoteca.osm_spike import summarize
              print(json.dumps(summarize(cands), ensure_ascii=False), flush=True)
              for c in cands:
                  print(f"[tag] {c.name} | {c.comuna} | {c.url} | {c.handle}", flush=True)
          except Exception as err:
              print(f"[tag] full query ERROR: {err}", flush=True)
          PY
          python probe.py
