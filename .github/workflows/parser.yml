name: Actualizar Bailoteca (parser)

on:
  schedule:
    # 1er día de cada mes, 03:00 UTC (40 queries/mes -> muy bajo cuota SerpApi free)
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar reportes, sin escribir en la base"
        type: boolean
        default: false
      host_covers:
        description: "Solo alojar las portadas actuales en Supabase Storage (backfill)"
        type: boolean
        default: false
      missing_rating:
        description: "Completar ratings faltantes de Google Maps (no toca portadas)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache de búsquedas SerpApi
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: parser/data/cache/serpapi
          key: serpapi-cache-${{ github.run_id }}
          restore-keys: |
            serpapi-cache-
      - run: |
          pip install --require-hashes --no-deps -r requirements-lock.txt
          pip install --no-deps -e shared -e parser
      - run: python -m pytest parser/tests shared/tests -q
      - name: Correr pipeline
        if: ${{ inputs.host_covers != true && inputs.missing_rating != true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BAILOTECA_SOURCES: ${{ secrets.BAILOTECA_SOURCES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BAILOTECA_REVIEW_TO_EMAIL: ${{ secrets.BAILOTECA_REVIEW_TO_EMAIL }}
          BAILOTECA_REVIEW_FROM_EMAIL: ${{ secrets.BAILOTECA_REVIEW_FROM_EMAIL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m bailoteca run --dry-run
          else
            python -m bailoteca run
          fi
      - name: Enriquecer con Google Maps
        if: ${{ inputs.dry_run != true && inputs.host_covers != true && inputs.missing_rating != true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python -m bailoteca enrich-places
      - name: Completar coordenadas (geocode)
        id: geocode
        if: ${{ inputs.dry_run != true && inputs.host_covers != true && inputs.missing_rating != true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          python -m bailoteca geocode --apply | tee /tmp/geocode-report.txt
      - name: Resumen geocode (google_embed)
        if: ${{ inputs.dry_run != true && inputs.host_covers != true && inputs.missing_rating != true }}
        run: |
          if grep -E "\(google_embed\)" /tmp/geocode-report.txt > /tmp/geocode-embed.txt; then
            { echo "### Pines google_embed"; echo '```'; cat /tmp/geocode-embed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin pines google_embed este run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Subir reporte geocode
        if: ${{ inputs.dry_run != true && inputs.host_covers != true && inputs.missing_rating != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geocode-report
          path: /tmp/geocode-report.txt
          retention-days: 30
      - name: Refrescar portadas (og:image)
        if: ${{ inputs.dry_run != true && inputs.host_covers != true && inputs.missing_rating != true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m bailoteca refresh-images
      - name: Completar ratings faltantes
        if: ${{ inputs.missing_rating == true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m bailoteca enrich-places --missing-rating
      - name: Host de portadas (backfill)
        if: ${{ inputs.host_covers == true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m bailoteca host-covers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes
          path: parser/reports/
          retention-days: 7
