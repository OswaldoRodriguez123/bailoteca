name: Actualizar Bailoteca (parser)

on:
  schedule:
    # 1er día de cada mes, 03:00 UTC (40 queries/mes -> muy bajo cuota SerpApi free)
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar reportes, sin escribir en la base"
        type: boolean
        default: false
      host_covers:
        description: "Solo alojar las portadas actuales en Supabase Storage (backfill)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache de búsquedas SerpApi
        uses: actions/cache@v4
        with:
          path: parser/data/cache/serpapi
          key: serpapi-cache-${{ github.run_id }}
          restore-keys: |
            serpapi-cache-
      - run: pip install -e shared -e "parser[dev]"
      - run: python -m pytest parser/tests shared/tests -q
      - name: Correr pipeline
        if: ${{ inputs.host_covers != true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BAILOTECA_SOURCES: ${{ secrets.BAILOTECA_SOURCES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BAILOTECA_REVIEW_TO_EMAIL: ${{ secrets.BAILOTECA_REVIEW_TO_EMAIL }}
          BAILOTECA_REVIEW_FROM_EMAIL: ${{ secrets.BAILOTECA_REVIEW_FROM_EMAIL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m bailoteca run --dry-run
          else
            python -m bailoteca run
          fi
      - name: Enriquecer con Google Maps
        if: ${{ inputs.dry_run != true && inputs.host_covers != true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python -m bailoteca enrich-places
      - name: Refrescar portadas (og:image)
        if: ${{ inputs.dry_run != true && inputs.host_covers != true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m bailoteca refresh-images
      - name: Host de portadas (backfill)
        if: ${{ inputs.host_covers == true }}
        working-directory: parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m bailoteca host-covers --recovered-manifest "$GITHUB_WORKSPACE/parser/repair/recovered-sources-2026-11-11.json"
      - uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: parser/reports/
          retention-days: 7
